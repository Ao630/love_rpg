<!DOCTYPE html>
<!--
  debug.html : 開発用デバッグページ
  - どこからもリンクしない。検索窓にURL（…/debug.html）を直接入力してアクセスする。
  - パスワードを入力すると下の「ページ移動」「戦闘テスト」が表示される。
  - 設定（パスワード・ページ一覧・戦闘の初期値）は debug.js の先頭 DEBUG_CONFIG にまとめてある。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow"><!-- 検索エンジンに載せない -->
  <title>デバッグ用ページ</title>
  <link rel="stylesheet" href="debug.css">
</head>
<body>
  <h1>デバッグ用ページ</h1>

  <!-- ① パスワード入力（認証前はこれだけ表示） -->
  <section id="login-area">
    <form id="login-form">
      <label>パスワード <input type="password" id="password-input" autocomplete="off"></label>
      <button type="submit">入る</button>
    </form>
    <p id="login-message" class="message"></p>
  </section>

  <!-- 認証後に表示される本体 -->
  <main id="tools-area" hidden>
    <p><button type="button" id="logout-button">ログアウト</button></p>

    <!-- ② ページ移動 -->
    <section>
      <h2>ページ移動</h2>
      <div id="page-links"></div>
      <form id="jump-form">
        <label>URL / ファイル名
          <input type="text" id="jump-input" placeholder="例: index.html" size="30">
        </label>
        <button type="submit">移動</button>
      </form>
      <p id="jump-message" class="message"></p>
    </section>

    <!-- ③ 戦闘テスト（好きな敵と戦う） -->
    <section>
      <h2>戦闘テスト</h2>

      <fieldset>
        <legend>設定（「リセット」で反映）</legend>
        <label>好感度の最大値 <input type="number" id="cfg-loveMax" step="any"></label>
        <label>アタック1回の好感度増加 <input type="number" id="cfg-loveInc" step="any"></label><br>
        <label>成功率の初期値(%) <input type="number" id="cfg-rateInit" step="any"></label>
        <label>アタック1回の成功率増加(%) <input type="number" id="cfg-rateInc" step="any"></label><br>
        <label>成功率の自然減少(%/秒) <input type="number" id="cfg-rateDecay" step="any"></label>
        <label>成功率の下限(%) <input type="number" id="cfg-rateMin" step="any"></label>
        <label>成功率の上限(%) <input type="number" id="cfg-rateMax" step="any"></label>
      </fieldset>

      <p>
        <label>敵を選ぶ
          <select id="enemy-select"></select>
        </label>
        <button type="button" id="reset-button">リセット</button>
      </p>

      <div id="battle-area">
        <div id="enemy-image-box"><img id="enemy-image" src="" alt="" hidden></div>
        <p>敵: <span id="enemy-name">-</span></p>
        <p>フェーズ: <span id="phase-label">-</span></p>
        <p>好感度: <span id="love-text">0 / 0</span>
          <progress id="love-gauge" value="0" max="1"></progress></p>
        <p>告白成功率: <span id="rate-text">-</span></p>
        <p>セリフ: <span id="line-text"></span></p>
        <p>
          <button type="button" id="attack-button">アタックする</button>
          <button type="button" id="confess-button" hidden>告白しろ！！！</button>
        </p>
        <p>
          <button type="button" id="max-love-button">（デバッグ）好感度MAX</button>
          <button type="button" id="max-rate-button">（デバッグ）成功率を上限に</button>
        </p>
        <p id="result-text" class="message"></p>
      </div>
    </section>
  </main>

  <!-- 読み込み順：キャラクター登録データ → デバッグ処理 -->
  <script src="data/characters.js"></script>
  <script src="debug.js"></script>
  <script>
    // 読み込み失敗・実行エラーを画面に出す（「何も起こらない」を防ぐ）
    function showDebugError(text) {
      var m = document.getElementById("login-message");
      if (m) m.textContent = text;
    }
    window.addEventListener("error", function (e) {
      showDebugError("エラー: " + (e.message || "読み込みに失敗しました") + (e.filename ? " (" + e.filename.split("/").pop() + ")" : ""));
    });
    window.addEventListener("load", function () {
      if (!window.__debugLoaded) showDebugError("debug.js が読み込めていません。debug.html と同じ場所に debug.js があるか確認してください。");
      else if (typeof NORMAL_CHARACTERS === "undefined") showDebugError("data/characters.js が読み込めていません。data フォルダの場所を確認してください。");
    });
  </script>
</body>
</html>
